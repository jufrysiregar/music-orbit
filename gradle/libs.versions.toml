[versions]
kotlin              = "2.0.21"
agp                 = "8.7.3"
composePlugin       = "1.7.3"
media3              = "1.5.1"
koin                = "4.0.0"
sqldelight          = "2.0.2"
multiplatformSettings = "1.2.0"
coroutines          = "1.9.0"
coil                = "2.7.0"
navigation          = "2.8.5"
lifecycle           = "2.8.7"
activity            = "1.9.3"
coreKtx             = "1.15.0"
accompanist         = "0.36.0"
kotest              = "5.9.1"

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",   version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                version.ref = "composePlugin" }
android-application   = { id = "com.android.application",              version.ref = "agp" }
android-library       = { id = "com.android.library",                  version.ref = "agp" }
sqldelight            = { id = "app.cash.sqldelight",                  version.ref = "sqldelight" }

[libraries]
# Kotlin / Coroutines
coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",        version.ref = "coroutines" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",     version.ref = "coroutines" }

# SQLDelight
sqldelight-runtime    = { module = "app.cash.sqldelight:runtime",                        version.ref = "sqldelight" }
sqldelight-android    = { module = "app.cash.sqldelight:android-driver",                 version.ref = "sqldelight" }
sqldelight-native     = { module = "app.cash.sqldelight:native-driver",                  version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions",          version.ref = "sqldelight" }

# Koin
koin-core           = { module = "io.insert-koin:koin-core",                             version.ref = "koin" }
koin-android        = { module = "io.insert-koin:koin-android",                          version.ref = "koin" }
koin-compose        = { module = "io.insert-koin:koin-androidx-compose",                 version.ref = "koin" }

# Multiplatform Settings
multiplatform-settings            = { module = "com.russhwolf:multiplatform-settings",               version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines",    version.ref = "multiplatformSettings" }

# Media3 (Android only)
media3-exoplayer    = { module = "androidx.media3:media3-exoplayer",                     version.ref = "media3" }
media3-session      = { module = "androidx.media3:media3-session",                       version.ref = "media3" }
media3-ui           = { module = "androidx.media3:media3-ui",                            version.ref = "media3" }

# Compose & AndroidX (androidApp only)
compose-bom            = { module = "androidx.compose:compose-bom",                      version = "2024.12.01" }
compose-ui             = { module = "androidx.compose.ui:ui" }
compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-manifest   = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4     = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3      = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
navigation-compose     = { module = "androidx.navigation:navigation-compose",            version.ref = "navigation" }
lifecycle-viewmodel    = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-runtime      = { module = "androidx.lifecycle:lifecycle-runtime-ktx",          version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
activity-compose       = { module = "androidx.activity:activity-compose",                version.ref = "activity" }
core-ktx               = { module = "androidx.core:core-ktx",                            version.ref = "coreKtx" }
coil-compose           = { module = "io.coil-kt:coil-compose",                           version.ref = "coil" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions",   version.ref = "accompanist" }

# Testing
junit                = { module = "junit:junit",                                          version = "4.13.2" }
androidx-junit       = { module = "androidx.test.ext:junit",                             version = "1.2.1" }
androidx-espresso    = { module = "androidx.test.espresso:espresso-core",                version = "3.6.1" }
kotest-runner        = { module = "io.kotest:kotest-runner-junit5",                      version.ref = "kotest" }
kotest-property      = { module = "io.kotest:kotest-property",                           version.ref = "kotest" }
kotest-assertions    = { module = "io.kotest:kotest-assertions-core",                    version.ref = "kotest" }
